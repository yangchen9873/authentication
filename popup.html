<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>身份验证器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="app-header">
        <span id="account-count" class="account-count">0 个验证器</span>
        <div class="header-actions">
          <button id="scan-qr" class="icon-button" type="button" aria-label="扫码添加" title="扫码">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zM3 14h2v5h5v2H3v-7zm16 0h2v7h-7v-2h5v-5zM7 7h4v4H7V7zm6 0h4v4h-4V7zM7 13h4v4H7v-4zm6 2h1v1h-1v-1zm2 0h1v1h-1v-1zm0 2h1v1h-1v-1zm-2 0h1v1h-1v-1zm4-2h1v1h-1v-1zm0 2h1v1h-1v-1z"/>
            </svg>
          </button>
          <button id="show-add" class="icon-button" type="button" aria-label="手动新增" title="手动新增">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/>
            </svg>
          </button>
          <button id="show-import" class="icon-button" type="button" aria-label="批量导入" title="批量导入">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M5 4h10v2H5v12h10v2H3V4h2zm9 4 5 4-5 4v-3H8v-2h6V8zm3 10h2v2h-2v-2z"/>
            </svg>
          </button>
          <button id="export-accounts" class="icon-button" type="button" aria-label="导出全部" title="导出全部">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M11 3h2v10l3.5-3.5 1.4 1.4-5.9 5.9-5.9-5.9 1.4-1.4L11 13V3zm-6 15h14v3H5v-3z"/>
            </svg>
          </button>
          <button id="toggle-manage" class="icon-button" type="button" aria-label="管理验证器" title="管理" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="m4 16.5-.9 4.4 4.4-.9L18.2 9.3l-3.5-3.5L4 16.5zM16.1 4.4l1-1a2 2 0 0 1 2.8 2.8l-1 1-2.8-2.8z"/>
            </svg>
          </button>
        </div>
      </header>
      <section id="import-panel" class="import-panel" hidden>
        <div class="import-dialog" role="dialog" aria-modal="false" aria-labelledby="import-title">
          <div class="import-title-row">
            <h2 id="import-title">批量导入</h2>
            <button id="import-close" class="import-close" type="button" aria-label="关闭">×</button>
          </div>
          <p class="import-help">每行一个 otpauth 链接，或：颁发者 | 账户 | 密钥</p>
          <textarea id="import-input" rows="6" spellcheck="false" placeholder="Google | name@example.com | Base32 密钥"></textarea>
          <div class="import-actions">
            <span id="import-message" class="import-message" role="status"></span>
            <button id="import-submit" class="import-submit" type="button">导入</button>
          </div>
        </div>
      </section>
      <section id="add-panel" class="add-panel" hidden>
        <div class="import-title-row">
          <h2>手动新增</h2>
          <button id="add-close" class="import-close" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field-label">颁发者<input id="add-issuer" type="text" placeholder="Google" /></label>
        <label class="field-label">账户<input id="add-account" type="text" placeholder="name@example.com" /></label>
        <label class="field-label">密钥<input id="add-secret" type="text" spellcheck="false" placeholder="Base32 密钥" /></label>
        <div class="import-actions">
          <span id="add-message" class="import-message" role="status"></span>
          <button id="add-submit" class="import-submit" type="button">添加</button>
        </div>
      </section>
      <section class="account-list" aria-label="已添加的验证器">
        <p id="empty-state" class="empty-state">暂无验证器</p>
        <ul id="accounts" class="accounts" aria-live="polite"></ul>
      </section>
      <section id="delete-confirm" class="confirm-overlay" hidden>
        <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
          <h2 id="confirm-title">删除验证器？</h2>
          <p id="confirm-account"></p>
          <div class="confirm-actions">
            <button id="confirm-cancel" class="confirm-cancel" type="button">取消</button>
            <button id="confirm-delete" class="confirm-delete" type="button">删除</button>
          </div>
        </div>
      </section>
      <section id="account-qr" class="confirm-overlay" hidden>
        <div class="qr-dialog" role="dialog" aria-modal="true" aria-labelledby="qr-title">
          <div class="import-title-row">
            <h2 id="qr-title">扫描二维码</h2>
            <button id="qr-close" class="import-close" type="button" aria-label="关闭">×</button>
          </div>
          <p id="qr-account" class="qr-account"></p>
          <img id="qr-image" class="qr-image" alt="验证器配置二维码" />
          <p class="qr-help">请使用身份验证器应用扫描。二维码含有密钥，请勿分享。</p>
        </div>
      </section>
    </main>
    <script src="lib/totp.js"></script>
    <script src="lib/qrcode.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
